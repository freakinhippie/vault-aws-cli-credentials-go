version: 2

project_name: vaultcreds

snapshot:
  version_template: "{{ if .Env.VERSION }}{{ .Env.VERSION }}{{ else }}{{ .Version }}{{ end }}-SNAPSHOT"

builds:
  - id: vaultcreds-linux
    main: ./cmd/vaultcreds
    binary: vaultcreds
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: vaultcreds-windows
    main: ./cmd/vaultcreds
    binary: vaultcreds
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: vaultcreds-darwin
    main: ./cmd/vaultcreds
    binary: vaultcreds
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}
    hooks:
      post:
        - >-
          codesign --force --timestamp --options runtime
          --sign "{{ .Env.APPLE_CODESIGN_IDENTITY }}"
          "{{ .Path }}"

archives:
  - id: vaultcreds-archives
    ids:
      - vaultcreds-linux
      - vaultcreds-windows
      - vaultcreds-darwin
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
      - goos: darwin
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: checksums.txt

nfpms:
  - id: vaultcreds-packages
    ids:
      - vaultcreds-linux
    package_name: vaultcreds
    file_name_template: "{{ .ConventionalFileName }}"
    bindir: /usr/bin
    formats:
      - deb
      - rpm
      - apk
      - archlinux
    maintainer: "Vault AWS Credentials Helper Maintainers"
    description: "Vault AWS CLI/SDK external credential process helper"
    homepage: "https://github.com/freakinhippie/vault-aws-cli-credentials-go"
    section: utils
    priority: optional

homebrew_casks:
  - name: vaultcreds
    ids:
      - vaultcreds-archives
    repository:
      owner: freakinhippie
      name: homebrew-tap
      git:
        url: "ssh://git@github.com/freakinhippie/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"
    homepage: "https://github.com/freakinhippie/vault-aws-cli-credentials-go"
    description: "Vault AWS CLI/SDK external credential process helper"
    license: "Apache-2.0"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
